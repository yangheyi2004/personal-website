
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">YHY</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a ></li>
                <li><a href="about.html">关于我</a ></li>
                <li><a href="projects.html">项目</a ></li>
                <li><a href="contact.html" class="active">联系</a ></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>联系我</h1>
                <p>有任何问题或意向，欢迎随时联系</p >
            </div>
        </section>

        <section class="contact-content">
            <div class="container">
                <div class="contact-grid">
                    <div class="contact-info">
                        <h2>联系方式</h2>
                        
                        <div class="contact-item">
                            <div class="contact-icon">📧</div>
                            <div class="contact-detail">
                                <h3>邮箱</h3>
                                <p>2791130991@qq.com</p >
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">📱</div>
                            <div class="contact-detail">
                                <h3>电话</h3>
                                <p>+86 15382832970</p >
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">💼</div>
                            <div class="contact-detail">
                                <h3>LinkedIn</h3>
                                <p>无</p >
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">🐙</div>
                            <div class="contact-detail">
                                <h3>GitHub</h3>
                                <p>github.com/yangheyi2004</p >
                            </div>
                        </div>

                        <div class="contact-item">
                            <div class="contact-icon">📍</div>
                            <div class="contact-detail">
                                <h3>地址</h3>
                                <p>东莞市大朗镇</p >
                            </div>
                        </div>
                    </div>

                    <div class="contact-form">
                        <h2>发送消息</h2>
                        <form id="message-form">
                            <div class="form-group">
                                <label for="name">姓名</label>
                                <input type="text" id="name" name="name" required placeholder="可以联系我开另一个网页，那里有一点后端，可以窃取你的个人信息">
                            </div>
                            
                            <div class="form-group">
                                <label for="email">邮箱</label>
                                <input type="email" id="email" name="email" required placeholder="闹着玩的，都是练习网页，没有备案的，请不要举报">
                            </div>
                            
                            <div class="form-group">
                                <label for="subject">主题</label>
                                <input type="text" id="subject" name="subject" required placeholder="没有写后端处理，写着玩玩而已，要联系请用电话">
                            </div>
                            
                            <div class="form-group">
                                <label for="message">消息</label>
                                <textarea id="message" name="message" rows="5" required placeholder="这个网页是我用来练习整个linux操作系统和devops流程的"></textarea>
                            </div>
                            
                            <button type="submit" class="submit-btn">发送消息</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 杨和一. All rights reserved.</p >
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
